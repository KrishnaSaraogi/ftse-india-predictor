name: Predict next FTSE review

on:
  workflow_dispatch:
    inputs:
      review_date:
        description: "Review date to predict, e.g. 2026-09-30 (leave blank to auto-detect)"
        required: false
      refresh_nse:
        description: "Also refresh NSE data (free float/shares/listing)?"
        type: boolean
        default: false
  schedule:
    # 3 runs after each cut-off (31 Jan / 30 Apr / 31 Jul / 31 Oct):
    # day 3 (first attempt), day 10 and day 17 (safety net for late data)
    - cron: "0 6 3 2,5,8,11 *"
    - cron: "0 6 10 2,5,8,11 *"
    - cron: "0 6 17 2,5,8,11 *"

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine review date and NSE refresh flag
        id: params
        run: |
          python - <<'PY'
          import datetime, os

          manual_date = "${{ github.event.inputs.review_date }}"
          manual_refresh = "${{ github.event.inputs.refresh_nse }}"

          if manual_date:
              review_date = manual_date
          else:
              today = datetime.date.today()
              cutoff_to_review = {1: 3, 4: 6, 7: 9, 10: 12}
              review_month = cutoff_to_review.get(today.month)
              if review_month is None:
                  # not a scheduled month - default to the next upcoming review
                  review_month = min(m for m in (3, 6, 9, 12) if m >= today.month) \
                      if today.month <= 12 else 3
              year = today.year if review_month >= today.month else today.year + 1
              last_day = {3: 31, 6: 30, 9: 30, 12: 31}[review_month]
              review_date = f"{year}-{review_month:02d}-{last_day}"

          # NSE refreshes on the FIRST scheduled run of each quarter (day 3),
          # or whenever explicitly requested via manual dispatch
          today = datetime.date.today()
          is_first_run_of_quarter = today.day <= 5
          refresh_nse = manual_refresh == "true" or is_first_run_of_quarter

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"review_date={review_date}\n")
              f.write(f"refresh_nse={'--refresh-nse' if refresh_nse else ''}\n")
          PY

      - name: Run prediction
        run: |
          python scripts/run_prediction.py \
            --review-date "${{ steps.params.outputs.review_date }}" \
            ${{ steps.params.outputs.refresh_nse }}

      - name: Commit results
        run: |
          git config user.name "ftse-predictor-bot"
          git config user.email "actions@github.com"
          git add data/ outputs/
          git diff --quiet --cached || git commit -m "Prediction for ${{ steps.params.outputs.review_date }} ($(date -u +%Y-%m-%d))"
          git push
