name: Update backtest with real N-PORT data

on:
  workflow_dispatch: {}
  schedule:
    # first of every month - checks whether a new N-PORT filing has
    # appeared for any of the last 3 quarter-ends
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new N-PORT filings and update backtest
        run: python scripts/update_backtest.py

      - name: Commit results
        run: |
          git config user.name "ftse-predictor-bot"
          git config user.email "actions@github.com"
          git add data/ outputs/
          git diff --quiet --cached || git commit -m "Backtest update ($(date -u +%Y-%m-%d))"
          git push
