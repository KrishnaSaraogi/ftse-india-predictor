name: Predict next FTSE review

on:
  workflow_dispatch:
    inputs:
      review_date:
        description: "Review date to predict, e.g. 2026-09-30 (leave blank to auto-detect from baseline)"
        required: false
      refresh_nse:
        description: "Force NSE refresh regardless of cache age?"
        type: boolean
        default: false
  schedule:
    # 1st and 20th of EVERY month. Two purposes:
    #  - catches a newly-rolled-forward baseline within ~10 days of it
    #    landing (update_backtest.yml runs 1st/15th), rather than
    #    waiting for a narrow once-a-quarter window
    #  - the 1st-of-month runs land within a day of every cut-off date
    #    (31 Jan/30 Apr/31 Jul/31 Oct), serving as the original
    #    late-data safety net too - this schedule subsumes both jobs
    - cron: "0 6 1 * *"
    - cron: "0 6 20 * *"

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prediction
        run: |
          python - <<'PY'
          import os
          import subprocess

          cmd = ["python", "scripts/run_prediction.py"]

          review_date = "${{ github.event.inputs.review_date }}"
          if review_date:
              cmd += ["--review-date", review_date]

          if "${{ github.event.inputs.refresh_nse }}" == "true":
              cmd += ["--refresh-nse"]

          print("Running:", " ".join(cmd))
          result = subprocess.run(cmd)
          raise SystemExit(result.returncode)
          PY

      - name: Commit results
        run: |
          git config user.name "ftse-predictor-bot"
          git config user.email "actions@github.com"
          git add data/ outputs/
          git diff --quiet --cached || git commit -m "Prediction run ($(date -u +%Y-%m-%d))"
          git push
