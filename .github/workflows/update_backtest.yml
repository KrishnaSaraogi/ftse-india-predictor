name: Update backtest with real N-PORT data

on:
  workflow_dispatch: {}
  schedule:
    # 1st and 15th of every month - checks whether a new N-PORT filing
    # has appeared. Paired with predict.yml's 1st/20th schedule: a
    # baseline rolled forward on the 15th gets picked up by the next
    # prediction run on the 20th, keeping the gap between "real data
    # lands" and "next review gets predicted" to well under 2 weeks.
    - cron: "0 6 1 * *"
    - cron: "0 6 15 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new N-PORT filings and update backtest
        run: python scripts/update_backtest.py

      - name: Commit results
        run: |
          git config user.name "ftse-predictor-bot"
          git config user.email "actions@github.com"
          git add data/ outputs/
          git diff --quiet --cached || git commit -m "Backtest update ($(date -u +%Y-%m-%d))"
          git push

      - name: Ping healthchecks.io on success
        if: success()
        run: |
          if [ -n "${{ secrets.HEALTHCHECK_PING_URL_BACKTEST }}" ]; then
            curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_PING_URL_BACKTEST }}" || true
          else
            echo "HEALTHCHECK_PING_URL_BACKTEST secret not set - skipping ping"
          fi
